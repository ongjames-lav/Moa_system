<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Partnership Directory — City of Malabon University</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/src/styles.css">
  <style>
    /* ── Guest-specific design overrides ── */
    /* Hide admin actions */
    #uploadBtn, #selectAllBtn, #deleteSelectedBtn, .btn-view, .btn-delete, .moa-checkbox {
      display: none !important;
    }
    
    /* Modify header for guest identity */
    .header-actions {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .guest-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      padding: 0.3rem 0.8rem;
      border-radius: 999px;
    }

    .readonly-notice {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(0, 0, 0, 0.03);
      border: 1px solid rgba(0, 0, 0, 0.05);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 1rem;
    }
    
    /* Adjust sidebar for guest */
    .sidebar-section h3 {
      margin-bottom: 0.8rem;
    }
  </style>
</head>

<body>

  <!-- ==================== MAIN APP SCREEN (Guest View) ==================== -->
  <div id="appScreen" class="screen active">
    <header class="header">
      <div class="header-main">
        <div class="header-content">
          <h1><i class="fas fa-clipboard-list"></i> Partnership Directory</h1>
          <p>City of Malabon University — Public MOA Registry</p>
        </div>

        <div class="header-actions">
          <span class="guest-badge"><i class="fas fa-eye"></i> Guest Access</span>
          <button id="loginRedirectBtn" class="btn-logout" onclick="window.location.href='/'">
            <i class="fas fa-sign-in-alt"></i> Staff Login
          </button>
        </div>

        <button id="settingsToggleBtn" class="settings-toggle" title="Toggle Settings">
          <i class="fas fa-cog gear-icon"></i>
        </button>
      </div>

      <!-- Collapsible Settings Panel (Same as Admin) -->
      <div id="settingsPanel" class="settings-panel">
        <div class="settings-group">
          <div class="search-container" style="width: 100%; position: relative;">
            <i class="fas fa-search"
              style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.6);"></i>
            <input type="text" id="searchInput" class="search-input" placeholder="Search by company name..."
              style="padding-left: 35px;">
          </div>
        </div>
        <div class="settings-group">
          <select id="sortBy" class="form-select">
            <option value="uploadDate_DESC">Latest Uploaded</option>
            <option value="uploadDate_ASC">Oldest Uploaded</option>
            <option value="companyName_ASC">Company Name (A-Z)</option>
            <option value="companyName_DESC">Company Name (Z-A)</option>
            <option value="startDate_DESC">Start Date (Newest)</option>
            <option value="startDate_ASC">Start Date (Oldest)</option>
            <option value="endDate_DESC">End Date (Newest)</option>
            <option value="endDate_ASC">End Date (Oldest)</option>
          </select>
        </div>
        <div class="settings-group">
          <label class="view-mode-label">View</label>
          <div class="view-mode-buttons">
            <button id="tileViewBtn" class="view-mode-btn active" data-view="tile"><i class="fas fa-th-large"></i>
              Tiles</button>
            <button id="listViewBtn" class="view-mode-btn" data-view="list"><i class="fas fa-list"></i> List</button>
          </div>
        </div>
        <div class="settings-group">
          <label for="collegeFilter" class="filter-label">COLLEGE:</label>
          <select id="collegeFilter" class="form-select">
            <option value="">-- All Colleges --</option>
            <option value="CCS">CCS - College of Computer Studies</option>
            <option value="CTE">CTE - College of Teacher Education</option>
            <option value="CBA">CBA - College of Business Administration</option>
            <option value="CCJE">CCJE - College of Criminal Justice Education</option>
            <option value="CAS">CAS - College of Arts and Sciences</option>
            <option value="COA">COA - College of Accountancy</option>
            <option value="none">No College Selected</option>
          </select>
        </div>
        <div class="settings-group">
          <label for="partnerTypeFilter" class="filter-label">PARTNER TYPE:</label>
          <select id="partnerTypeFilter" class="form-select">
            <option value="">-- All Types --</option>
            <option value="Industry Partner">Industry Partner</option>
            <option value="Institutional Partner">Institutional Partner</option>
            <option value="none">No Partner Type Selected</option>
          </select>
        </div>
      </div>
    </header>

    <main class="container">
      <aside class="sidebar">
        <div class="sidebar-section">
          <h3>Filter by Status</h3>
          <div class="status-filter-buttons">
            <button class="status-filter-btn active" data-status="all"><i class="fas fa-folder-open"></i> All MOAs</button>
            <button class="status-filter-btn" data-status="active"><i class="fas fa-check-circle"></i> Active</button>
            <button class="status-filter-btn" data-status="dueForRenewal"><i class="fas fa-sync"></i> Renewal</button>
            <button class="status-filter-btn" data-status="expired"><i class="fas fa-history"></i> Expired</button>
          </div>
        </div>

        <div class="sidebar-section">
          <h3>Statistics</h3>
          <div class="stats">
            <div class="stat-item">
              <span id="totalCountLabel" class="stat-label">Total MOAs:</span>
              <span id="totalCount" class="stat-value">0</span>
            </div>
          </div>
        </div>

        <div class="sidebar-section" style="margin-top: auto; opacity: 0.6;">
          <p style="font-size: 0.75rem;"><i class="fas fa-lock"></i> Read-only Guest Access</p>
        </div>
      </aside>

      <section class="main-content">
        <div id="loadingSpinner" class="loading" style="display: none;">Loading MOAs...</div>
        <div id="emptyState" class="empty-state">
          <div class="empty-icon"><i class="fas fa-folder-open" style="font-size: 3rem; color: var(--border-color);"></i></div>
          <h2 id="emptyStateTitle">No MOAs Found</h2>
          <p id="emptyStateMessage">No documents match the current filters.</p>
        </div>
        <div id="moaList" class="moa-list" style="display: none;"></div>
        <div id="paginationControls" class="pagination-controls" style="display: none;">
          <button id="prevPageBtn" class="btn btn-secondary"><i class="fas fa-chevron-left"></i> Previous</button>
          <span id="pageInfo" class="page-info">Page 1</span>
          <button id="nextPageBtn" class="btn btn-secondary">Next <i class="fas fa-chevron-right"></i></button>
        </div>
      </section>
    </main>
  </div>

  <!-- ==================== INFO MODAL (Read-only) ==================== -->
  <div id="infoModal" class="modal" style="display: none;">
    <div class="modal-content info-modal-content">
      <button class="modal-close info-modal-close">&times;</button>
      <div class="readonly-notice">
        <i class="fas fa-eye"></i> You are viewing this MOA as a guest.
      </div>
      <div id="infoCardContainer"></div>
      <div style="margin-top: 1.5rem; display: flex; justify-content: flex-end;">
        <button id="infoDownloadBtn" class="btn btn-primary">
          <i class="fas fa-download"></i> Download PDF
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script type="module" src="/src/guest.js"></script>
</body>

</html>
